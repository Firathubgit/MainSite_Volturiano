<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Test ColorBends</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #root {
            width: 100%;
            height: 100%;
            display: block;
        }

        .absolute {
            position: absolute;
        }

        .relative {
            position: relative;
        }

        .inset-0 {
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
        }

        .w-full {
            width: 100%;
        }

        .min-h-screen {
            min-height: 100vh;
        }

        .h-full {
            height: 100%;
        }

        .overflow-hidden {
            overflow: hidden;
        }

        .z-0 {
            z-index: 0;
        }

        .bg-\[\#050505\] {
            background-color: #050505;
        }
    </style>
</head>

<body style="margin: 0; background: #000;">
    <div id="root"></div>
